name: deploy

# Publishes two versions to GitHub Pages in one deployment:
#   /        the live app, built from main
#   /next/   the preview, built from next (what the agents ship; promoted to main only by the owner)
# The hourly run refreshes weather.json in both.
on:
  push:
    branches: [main, next]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: live }
      - uses: actions/checkout@v4
        with: { ref: next, path: preview }
        continue-on-error: true
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build live
        working-directory: live
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npm ci && npm run build
      - name: Build preview
        run: |
          if [ -f preview/package.json ]; then
            (cd preview && npm ci && npm run build) && cp -r preview/dist live/dist/next || echo "::warning::preview build failed; publishing live only"
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: live/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
